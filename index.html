<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gantt widget</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <!-- <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>-->
    <link rel="stylesheet" href="gantt-chart.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="wrapper">
        <!-- Main Content -->
        <div class="main-content">
          <div class="chartCard">
            <div class="chartBox">
              <div class="canvasBoxFixe">
                <div class="canvasBoxBarreDefilement">
                  <canvas id="diagrammeGantt"></canvas>
                </div>
              </div>
              <br>
              <div class="container text-center">
                <div class="row row-cols-auto">
                  <div class="col">
                      <button class="btn moisPrecedent" onclick="moisPrecedent()">
                        <i class="bi bi-caret-left-fill"></i>
                      </button>
                    </div>
                    <div class="col">
                      <input type="date" class="form-control" onchange="moisMilieu(this)" />
                    </div>
                    <div class="col">
                      <button class="btn moisSuivant" onclick="moisSuivant()">
                        <i class="bi bi-caret-right-fill"></i>
                      </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar collapsed" id="sidebar">
            <div class="sidebar-header p-3">
                <div class="d-flex align-items-center justify-content-between">
                    <h5 class="mb-0">Options</h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-light" onclick="basculerPanneauOption()">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </div>
                </div>
            </div>


            <!-- Navigation -->
            <nav class="nav flex-column mt-2">
                <button class="nav-link" onclick="telechargementJPEG()"> <i class="bi bi-arrow-down-circle"></i> JPEG</button>
                <button class="nav-link" onclick="telechargementPNG()"> <i class="bi bi-arrow-down-circle"></i> PNG</button>
            </nav>

        </div>
    </div>
    <script type="text/javascript" src="js_lib/chart.js"></script>
    <script type="text/javascript" src="js_lib/chartjs-adapter-date-fns.js"></script>
    <script type="text/javascript" src="gantt-chart.js"></script>
  </body>
</html>
